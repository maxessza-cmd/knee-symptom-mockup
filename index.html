<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แบบคัดกรองอาการเข่า</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
  :root {
    --bg: #070b12;
    --panel: #101820;
    --panel-2: #162230;
    --line: rgba(140, 210, 220, 0.16);
    --text: #e7f2f6;
    --muted: #93a8b6;
    --accent: #2ec4b6;
    --accent-2: #8ef0e4;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    --radius: 16px;
    --max: 1180px;
    --font: "Noto Sans Thai", "Leelawadee UI", sans-serif;
    --display: "Space Grotesk", "Noto Sans Thai", sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font);
    color: var(--text);
    background:
      radial-gradient(900px 420px at 0% -10%, rgba(46, 196, 182, 0.16), transparent 55%),
      radial-gradient(700px 380px at 100% 0%, rgba(70, 120, 190, 0.18), transparent 50%),
      var(--bg);
    line-height: 1.6;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(46, 196, 182, 0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46, 196, 182, 0.04) 1px, transparent 1px);
    background-size: 52px 52px;
    mask-image: linear-gradient(180deg, #000 0%, transparent 80%);
  }
  a { color: var(--accent-2); text-decoration: none; }
  .site-header {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(16px);
    background: rgba(7, 11, 18, 0.78);
    border-bottom: 1px solid var(--line);
  }
  .nav-wrap, .hero, .workspace {
    width: min(var(--max), calc(100% - 32px));
    margin-inline: auto;
  }
  .nav-wrap {
    height: 68px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: inherit;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: rgba(46, 196, 182, 0.14);
    border: 1px solid var(--line);
  }
  .brand-mark svg {
    width: 22px;
    height: 22px;
    fill: none;
    stroke: var(--accent-2);
    stroke-width: 1.7;
  }
  .brand-text {
    display: flex;
    flex-direction: column;
    font-family: var(--display);
    font-weight: 700;
    line-height: 1.15;
  }
  .brand-text small {
    font-family: var(--font);
    font-weight: 500;
    color: var(--muted);
  }
  .nav-links { display: flex; gap: 18px; color: var(--muted); }
  .hero { padding: 42px 0 8px; }
  h1, h2, h3 { font-family: var(--display); font-weight: 700; }
  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    line-height: 1.25;
  }
  .note {
    max-width: 720px;
    margin: 12px 0 0;
    color: var(--muted);
  }
  .combo-pills {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
  }
  .combo-pills span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(16, 24, 32, 0.8);
  }
  .combo-pills b { font-family: var(--display); color: var(--accent-2); }
  .combo-pills .plus { padding: 0; border: 0; background: none; color: var(--muted); }
  .workspace {
    display: grid;
    grid-template-columns: minmax(320px, 440px) minmax(0, 1fr);
    gap: 18px;
    padding: 22px 0 56px;
    align-items: start;
  }
  .panel {
    background: rgba(16, 24, 32, 0.92);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 20px;
  }
  .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
  }
  .panel-head h2 { margin: 0; font-size: 1.25rem; }
  .panel-head p { margin: 4px 0 0; color: var(--muted); }
  button {
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  fieldset {
    margin: 18px 0 0;
    padding: 0;
    border: 0;
    min-inline-size: 0;
  }
  legend {
    padding: 0;
    margin-bottom: 10px;
    font-family: var(--display);
    font-weight: 700;
  }
  .symptom {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    margin-top: 8px;
    padding: 10px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    cursor: pointer;
  }
  .symptom:has(input:checked) {
    border-color: rgba(46, 196, 182, 0.7);
    background: rgba(46, 196, 182, 0.1);
  }
  .symptom input { margin-top: 4px; accent-color: #14b8a6; }
  .finding-list { display: grid; gap: 10px; }
  .finding {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 6px 12px;
    align-items: center;
  }
  .finding-name { min-width: 0; }
  .finding b { display: block; font-weight: 600; }
  .finding em {
    display: block;
    font-style: normal;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .score {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.05rem;
  }
  .finding.pass .score { color: var(--accent-2); }
  .meter {
    grid-column: 1 / -1;
    height: 8px;
    border-radius: 99px;
    background: #0c141c;
    overflow: hidden;
  }
  .meter span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #1a8f86, var(--accent-2));
  }
  .finding.pass .meter span { background: linear-gradient(90deg, #d89a16, #ffe08a); }
  .section-label {
    margin: 22px 0 0;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .plans { display: grid; gap: 12px; margin-top: 12px; }
  .plan {
    padding: 14px;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: rgba(8, 12, 18, 0.45);
  }
  .plan h3 { margin: 0; font-size: 1.05rem; }
  .plan .score-tag {
    font-family: var(--display);
    color: var(--accent-2);
    font-size: 0.95rem;
  }
  .plan ul { margin: 8px 0 0; padding-left: 1.15rem; }
  .plan .meta { margin: 10px 0 0; color: var(--muted); font-size: 0.92rem; }
  .empty {
    margin-top: 16px;
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 14px;
  }
  button:focus-visible, a:focus-visible, .symptom:focus-within {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  @media (max-width: 900px) {
    .workspace { grid-template-columns: 1fr; }
    .nav-links { display: none; }
  }
</style>
</head>
<body>
<header class="site-header">
  <div class="nav-wrap">
    <a class="brand" href="#top">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M4 14c3-8 6-10 8-10s5 2 8 10"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span class="brand-text">
        คัดกรองเข่า
        <small>แบบคัดกรอง + แผนฟื้นตัว</small>
      </span>
    </a>
    <nav class="nav-links" aria-label="ส่วนของหน้า">
      <a href="#screen">แบบคัดกรอง</a>
      <a href="#result">ผลและแผน</a>
    </nav>
  </div>
</header>
<main id="top">
  <section class="hero">
    <h1>แบบคัดกรองอาการเข่า</h1>
    <p class="note">หน้านี้เป็น mockup สำหรับสาธิต ไม่ใช่การวินิจฉัยและไม่ใช่ใบสั่งรักษา</p>
    <div class="combo-pills">
      <span><b>01</b> แบบคัดกรอง</span>
      <span class="plus" aria-hidden="true">+</span>
      <span><b>02</b> แผนฟื้นตัว</span>
    </div>
  </section>
  <div class="workspace">
    <form class="panel" id="screen" autocomplete="off">
      <div class="panel-head">
        <div>
          <h2>แบบคัดกรอง</h2>
          <p id="picked">ยังไม่ได้เลือกอาการ</p>
        </div>
        <button type="button" id="clear">ล้างอาการที่เลือก</button>
      </div>
      <div id="form"></div>
    </form>
    <section class="panel" id="result" aria-live="polite">
      <div class="panel-head">
        <div>
          <h2>ผลและแผนฟื้นตัว</h2>
          <p>ป้ายที่ได้ตั้งแต่ 0.40 มีการ์ดแผนด้านล่าง</p>
        </div>
      </div>
      <div class="finding-list" id="results"></div>
      <p class="section-label">แผนฟื้นตัว</p>
      <div class="plans" id="plans"></div>
    </section>
  </div>
</main>

    title: "ตำแหน่งที่เจ็บ และอาการที่เป็นมานาน",
    items: [
      { id: "press-in", text: "กดตามแนวด้านในข้อแล้วเจ็บ", weights: { MCL: 1, MM: 2 } },
      { id: "inner-chronic", text: "ปวดด้านในเข่ามานาน และเดินแล้วปวดขึ้น", weights: { MOA: 3 } },
      { id: "outer-chronic", text: "ปวดด้านนอกเข่ามานาน และเดินแล้วปวดขึ้น", weights: { LOA: 3 } },
      { id: "stiff", text: "หลังนั่งนานหรือตื่นนอน เข่าติด ต้องขยับก่อน", weights: { MOA: 1, LOA: 1, PF: 1 } },
      { id: "stairs", text: "เจ็บด้านหน้าเข่าเวลาขึ้นหรือลงบันได", weights: { PF: 3 } },
      { id: "sit", text: "นั่งงอเข่านานแล้วลุกขึ้นเจ็บด้านหน้า", weights: { PF: 3 } },
      { id: "lump", text: "คลำได้ก้อนนิ่มด้านหลังพับเข่า", weights: { BAK: 3 } },
      { id: "back", text: "เหยียดแล้วตึงหรือเจ็บด้านหลังเข่า", weights: { BAK: 3 } }
    ]
  },
  {
    title: "บวม ร้อน และตึงในข้อ",
    items: [
      { id: "swell", text: "เข่าบวม มองเห็นว่าใหญ่กว่าอีกข้าง", weights: { EFF: 3 } },
      { id: "tight", text: "เหยียดสุดแล้วรู้สึกตึงในข้อ", weights: { EFF: 1, BAK: 1 } },
      { id: "move-pain", text: "ข้อบวมและเจ็บเวลาขยับ", weights: { EFF: 1, SYN: 2 } },
      { id: "warm", text: "เข่าอุ่น และปวดแม้ตอนไม่ได้ขยับ", weights: { SYN: 3 } }
    ]
  }
];

const symptoms = groups.flatMap((group) => group.items);
const maxWeight = {};
labels.forEach((label) => { maxWeight[label.id] = 0; });
symptoms.forEach((symptom) => {
  Object.entries(symptom.weights).forEach(([id, weight]) => {
    maxWeight[id] += weight;
  });
});

const form = document.getElementById("form");
const results = document.getElementById("results");
const plans = document.getElementById("plans");
const picked = document.getElementById("picked");

groups.forEach((group) => {
  const field = document.createElement("fieldset");
  const legend = document.createElement("legend");
  legend.textContent = group.title;
  field.appendChild(legend);
  group.items.forEach((symptom) => {
    const label = document.createElement("label");
    label.className = "symptom";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.value = symptom.id;
    input.addEventListener("change", render);
    const text = document.createElement("span");
    text.textContent = symptom.text;
    label.append(input, text);
    field.appendChild(label);
  });
  form.appendChild(field);
});

document.getElementById("clear").addEventListener("click", () => {
  form.querySelectorAll("input").forEach((input) => { input.checked = false; });
  render();
});

function selectedSymptoms() {
  const ids = new Set(Array.from(form.querySelectorAll("input:checked")).map((input) => input.value));
  return symptoms.filter((symptom) => ids.has(symptom.id));
}

function scoreOf(id, chosen) {
  let earned = 0;
  const parts = [];
  chosen.forEach((symptom) => {
    const weight = symptom.weights[id] || 0;
    if (weight > 0) {
      earned += weight;
      parts.push(symptom.text + " +" + weight);
    }
  });
  const total = maxWeight[id];
  return { earned, total, score: total === 0 ? 0 : earned / total, parts };
}

function render() {
  const chosen = selectedSymptoms();
  picked.textContent = chosen.length === 0
    ? "ยังไม่ได้เลือกอาการ"
    : "เลือกแล้ว " + chosen.length + " อาการ";

  results.replaceChildren();
  const passing = [];
  labels.forEach((label) => {
    const calc = scoreOf(label.id, chosen);
    const shown = calc.score.toFixed(2);
    const pass = calc.score >= 0.4;
    if (pass) passing.push({ label, shown });

    const row = document.createElement("article");
    row.className = pass ? "finding pass" : "finding";
    const name = document.createElement("div");
    name.className = "finding-name";
    const title = document.createElement("b");
    title.textContent = label.thai;
    const column = document.createElement("em");
    column.textContent = label.column;
    name.append(title, column);
    const score = document.createElement("div");
    score.className = "score";
    score.textContent = shown;
    const meter = document.createElement("div");
    meter.className = "meter";
    const fill = document.createElement("span");
    fill.style.width = Math.round(calc.score * 100) + "%";
    meter.appendChild(fill);
    row.append(name, score, meter);
    results.appendChild(row);
  });

  plans.replaceChildren();
  if (!passing.length) {
    const empty = document.createElement("p");
    empty.className = "empty";
    empty.textContent = chosen.length
      ? "ยังไม่มีป้ายที่ได้ตั้งแต่ 0.40 จึงยังไม่แสดงแผนฟื้นตัว"
      : "เลือกอาการ แล้วแผนฟื้นตัวจะปรากฏเฉพาะป้ายที่คะแนนถึง 0.40";
    plans.appendChild(empty);
    return;
  }
  passing.forEach(({ label, shown }) => {
    const card = document.createElement("article");
    card.className = "plan";
    const title = document.createElement("h3");
    title.textContent = label.thai + " · " + label.column;
    const tag = document.createElement("p");
    tag.className = "score-tag";
    tag.textContent = shown;
    const list = document.createElement("ul");
    label.steps.forEach((step) => {
      const item = document.createElement("li");
      item.textContent = step;
      list.appendChild(item);
    });
    const note = document.createElement("p");
    note.className = "meta";
    note.textContent = "ข้อความนี้เป็นตัวอย่างในแบบจำลอง ไม่ใช่คำสั่งรักษา";
    card.append(title, tag, list, note);
    plans.appendChild(card);
  });
}

render();
</script>
</body>
</html>
